<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dhwani — IEEE ComSoc BMSIT&amp;M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, celebratory reading room for a souvenir volume
   IDEA: a printed magazine lying open on a desk
   PICTURE: the book itself, centred, real page curl
   COLOUR and TYPE: deep ink-teal ground, white paper, ComSoc blue accent; Manrope
   LAYOUT: slim title bar, book fills the screen, controls below */
:root{color-scheme:dark;--bg:#0e1c22;--bg2:#15303a;--ink:#eef4f6;--mut:#9fb6be;--acc:#3fa2e6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 40%,var(--bg2),var(--bg) 70%);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(3vw,14px);flex-wrap:wrap}
h1{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:800;letter-spacing:.01em}
h1 span{color:var(--mut);font-weight:500;font-size:.72em;margin-inline-start:8px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:4px max(3vw,10px)}
#wrap{width:min(94vw,calc((100vh - 150px) / 1.4142 * 2));max-width:1500px}
#book{margin:0 auto}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.page.ld{background:#fff linear-gradient(90deg,#f1f3f4,#fff,#f1f3f4);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px max(3vw,14px) 16px;flex-wrap:wrap}
button{font:inherit;font-weight:700;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;min-width:44px;height:44px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:rgba(255,255,255,.16)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ctr{min-width:92px;text-align:center;font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
#seek{width:min(360px,40vw);accent-color:var(--acc);height:44px}
#zoom{position:fixed;inset:0;background:rgba(6,12,15,.96);display:none;flex-direction:column;z-index:10}
#zoom.on{display:flex}
#zoom .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:var(--mut)}
#zbody{flex:1;overflow:auto;display:flex;gap:10px;justify-content:center;align-items:flex-start;padding:0 10px 20px}
#zbody img{width:min(100%,1100px);height:auto;background:#fff}
#zbody.two img{width:min(49%,900px)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin:0 0 10px}
@media(max-width:600px){#seek{width:100%;order:9}#wrap{width:94vw}.hide-s{display:none}#zbody.two{flex-direction:column;align-items:center}#zbody.two img{width:100%}}
@media(prefers-reduced-motion:reduce){.page.ld{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Dhwani <span class="hide-s">IEEE ComSoc Student Branch Chapter, BMSIT&amp;M</span></h1>
  <button id="fs" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="hide-s">Full screen</span></button>
</header>
<main><div id="wrap"><div id="book"></div></div></main>
<div class="bar">
  <button id="first" aria-label="First page"><svg viewBox="0 0 24 24"><path d="M18 18l-6-6 6-6M8 6v12"/></svg></button>
  <button id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span id="ctr">1 / 54</span>
  <button id="next" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button id="last" aria-label="Last page"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M16 6v12"/></svg></button>
  <input id="seek" type="range" min="1" max="54" value="1" aria-label="Go to page">
  <button id="zb" aria-label="Zoom to read"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></svg><span class="hide-s">Zoom</span></button>
</div>
<p class="hint">Drag a corner, tap the edges or use ← → to turn pages. Double-click a page to read it up close.</p>
<div id="zoom" role="dialog" aria-label="Zoomed pages">
  <div class="top"><span id="zl"></span><button id="zx" aria-label="Close zoom"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="zbody"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
{
const N=54,src=i=>'p-'+String(i+1).padStart(2,'0')+'.jpg';
const book=document.getElementById('book');
book.innerHTML=Array.from({length:N},(_,i)=>`<div class="page ld" data-density="${i===0||i===N-1?'hard':'soft'}"><img alt="Page ${i+1}" data-i="${i}" draggable="false"></div>`).join('');
const imgs=[...book.querySelectorAll('img')];
const load=i=>{const im=imgs[i];if(!im||im.src)return;im.onload=()=>im.parentNode.classList.remove('ld');im.src=src(i)};
const near=c=>{for(let k=c-3;k<=c+6;k++)load(k)};
near(0);
const ctr=document.getElementById('ctr'),seek=document.getElementById('seek');
let pf=null;
const cur=()=>pf?pf.getCurrentPageIndex():0;
const show=i=>{
  const portrait=pf&&pf.getOrientation()==='portrait';
  let a=i+1,t=a;
  if(!portrait&&i>0&&i<N-1){a=i%2?i+1:i;t=Math.min(a+1,N)}
  ctr.textContent=(a===t?a:a+'–'+t)+' / '+N;seek.value=i+1;near(i);
  try{if(i>0)history.replaceState(null,'','#p'+(i+1));else history.replaceState(null,'',location.pathname)}catch(e){}
};
const start=()=>{const m=/^#p(\d+)$/.exec(location.hash);return m?Math.min(Math.max(+m[1],1),N)-1:0};
if(typeof St==='undefined'){
  book.style.display='grid';book.style.gap='12px';imgs.forEach((_,i)=>load(i));
}else{
  pf=new St.PageFlip(book,{width:620,height:877,size:'stretch',minWidth:260,maxWidth:1100,minHeight:368,maxHeight:1556,showCover:true,maxShadowOpacity:.45,mobileScrollSupport:true,flippingTime:700,usePortrait:true,startPage:start(),autoSize:true});
  pf.loadFromHTML(book.querySelectorAll('.page'));
  pf.on('flip',e=>show(e.data));
  pf.on('changeOrientation',()=>show(cur()));
  show(start());near(start());
}
const go=i=>pf&&pf.flip(Math.max(0,Math.min(N-1,i)));
document.getElementById('prev').onclick=()=>pf&&pf.flipPrev();
document.getElementById('next').onclick=()=>pf&&pf.flipNext();
document.getElementById('first').onclick=()=>{if(pf){pf.turnToPage(0);show(0)}};
document.getElementById('last').onclick=()=>{if(pf){pf.turnToPage(N-1);show(N-1)}};
seek.oninput=()=>{near(seek.value-1);ctr.textContent=seek.value+' / '+N};
seek.onchange=()=>{if(pf){pf.turnToPage(seek.value-1);show(seek.value-1)}};
const zoom=document.getElementById('zoom'),zbody=document.getElementById('zbody'),zl=document.getElementById('zl');
const openZoom=()=>{
  const i=cur(),portrait=!pf||pf.getOrientation()==='portrait';
  let list=[i];
  if(!portrait&&i>0&&i<N-1){const a=i%2?i:i-1;list=[a,a+1].filter(x=>x<N)}
  zbody.className=list.length>1?'two':'';
  zbody.innerHTML=list.map(k=>`<img src="${src(k)}" alt="Page ${k+1}">`).join('');
  zl.textContent='Page '+list.map(k=>k+1).join('–');zoom.classList.add('on');zbody.scrollTop=0;
};
const closeZoom=()=>zoom.classList.remove('on');
document.getElementById('zb').onclick=openZoom;
document.getElementById('zx').onclick=closeZoom;
book.addEventListener('dblclick',openZoom);
zoom.addEventListener('click',e=>{if(e.target===zbody)closeZoom()});
document.addEventListener('keydown',e=>{
  if(zoom.classList.contains('on')){if(e.key==='Escape')closeZoom();return}
  if(e.target===seek)return;
  if(e.key==='ArrowRight'||e.key==='PageDown')pf&&pf.flipNext();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')pf&&pf.flipPrev();
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(N-1);
});
document.getElementById('fs').onclick=async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}
};
}
</script>
</body>
